
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /opt/nginx/conf/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;

    client_body_temp_path /tmp/nginx_client_body;
    proxy_temp_path /tmp/nginx_proxy;
    fastcgi_temp_path /tmp/nginx_fastcgi;
    uwsgi_temp_path /tmp/nginx_uwsgi;
    scgi_temp_path /tmp/nginx_scgi;

    # Performance & Kernel Optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    open_file_cache max=10000 inactive=30s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # Compression
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 1;
    gzip_min_length 8192;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/wasm
        image/svg+xml
        font/ttf
        font/otf;

    # Security
    server_tokens off;

    # Define a variable for literal dollar sign to avoid interpolation
    geo $literal_dollar {
        default "$";
    }


    map $uri $hdr_cache_control {
        default "";
        "~^.*/[^/]*\.png$" "max-age=100";
        "~^/exact$" "no-store";
    }

    map $uri $hdr_x_foo {
        default "";
        "~^.*/[^/]*\.png$" "bar \"with\" \\escapes";
    }

    map $uri $hdr_x_custom {
        default "";
        "~^/session$" "value${literal_dollar}with${literal_dollar}dollars";
    }

    map $uri $hdr_set_cookie_0 {
        default "";
        "~^/session$" "user=john; Path=/";
    }

    map $uri $hdr_set_cookie_1 {
        default "";
        "~^/session$" "session_id=123; Secure";
    }

    server {
        listen 8080 default_server;
        server_name _;

        root /my/app/root;
        index index.html;

        # Reverse-proxy & redirect safety for Cloud Run
        port_in_redirect off;

        # Block hidden dotfiles (.git, .env, .DS_Store)
        location ~ /\. {
            access_log off;
            log_not_found off;
            return 404;
        }

        

        add_header Cache-Control $hdr_cache_control always;
        add_header X-Foo $hdr_x_foo always;
        add_header X-Custom $hdr_x_custom always;
        add_header Set-Cookie $hdr_set_cookie_0 always;
        add_header Set-Cookie $hdr_set_cookie_1 always;

        

        

        

        

        # Default Fallback
        location / {
            
            
            try_files $uri $uri/ =404;
            
            
        }

        absolute_redirect off;
    }
}
