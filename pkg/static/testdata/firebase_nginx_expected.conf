
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /opt/nginx/conf/mime.types;
    access_log /dev/stdout;

    client_body_temp_path /tmp/nginx_client_body;
    proxy_temp_path /tmp/nginx_proxy;
    fastcgi_temp_path /tmp/nginx_fastcgi;
    uwsgi_temp_path /tmp/nginx_uwsgi;
    scgi_temp_path /tmp/nginx_scgi;

    # Define a variable for literal dollar sign to avoid interpolation
    geo $literal_dollar {
        default "$";
    }


    map $uri $hdr_cache_control {
        default "";
        "~^.*/[^/]*\.png$" "max-age=100";
        "~^/exact$" "no-store";
    }

    map $uri $hdr_x_foo {
        default "";
        "~^.*/[^/]*\.png$" "bar \"with\" \\escapes";
    }

    map $uri $hdr_x_custom {
        default "";
        "~^/session$" "value${literal_dollar}with${literal_dollar}dollars";
    }

    map $uri $hdr_set_cookie_0 {
        default "";
        "~^/session$" "user=john; Path=/";
    }

    map $uri $hdr_set_cookie_1 {
        default "";
        "~^/session$" "session_id=123; Secure";
    }

    server {
        listen 8080;
        root /my/app/root;
        index index.html;

        add_header Cache-Control $hdr_cache_control always;
        add_header X-Foo $hdr_x_foo always;
        add_header X-Custom $hdr_x_custom always;
        add_header Set-Cookie $hdr_set_cookie_0 always;
        add_header Set-Cookie $hdr_set_cookie_1 always;

        

        

        # Default Fallback
        location / {
            try_files $uri $uri/ /index.html;
        }

        absolute_redirect off;
    }
}
